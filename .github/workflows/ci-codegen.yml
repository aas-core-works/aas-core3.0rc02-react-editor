name: CI-codegen

on:
  push:
    branches: [ master, main ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  Execute-continuous-integration-for-codegen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
      - uses: actions/checkout@master

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # NOTE (aaronzi, 2026-11-05):
        # The pinned aas-core-codegen (18ee84f) has specifiers like `pydocstyle>=2.1.1<3`
        # in its setup.py. pip >= 24.1, setuptools >= 66 and wheel >= 0.40 reject them.
        # We cap these three and build without isolation, so that pip builds the package
        # with the capped setuptools and wheel instead of fetching the latest ones.
        run: |
          python3 -m pip install --upgrade "pip<24.1" "setuptools<66" "wheel<0.40"
          pip3 install --upgrade coveralls
          pip3 install --no-build-isolation -e .[dev]
        working-directory: codegen

      - name: Run checks
        run: |
          python3 continuous_integration/precommit.py
        working-directory: codegen
